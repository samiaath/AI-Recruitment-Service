# Configuration SonarCloud (analyse qualité + vulnérabilités).
# À COMPLÉTER après création du compte SonarCloud (voir guide CI/CD) :
#   - sonar.projectKey   : copié depuis SonarCloud (ex: samia_ai-recruitment)
#   - sonar.organization : ta clé d'organisation SonarCloud
sonar.projectKey=samiaath_AI-Recruitment-Service
sonar.organization=samiaath

# Nom affiché dans le tableau de bord SonarCloud.
sonar.projectName=AI Recruitment Service

# Code analysé / tests / version Python.
sonar.sources=ai_service
sonar.tests=tests
sonar.python.version=3.11,3.12

# Rapport de couverture produit par pytest (--cov-report=xml).
sonar.python.coverage.reportPaths=coverage.xml

# Encodage des sources.
sonar.sourceEncoding=UTF-8
