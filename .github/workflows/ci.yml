name: CI/CD Pipeline

# Déclencheurs : à chaque push ou pull request sur les branches principales.
on:
  push:
    branches: [main, master, develop, dev]
  pull_request:
    branches: [main, master, develop, dev]

# Droits accordés au workflow (publication d'image + remontée des alertes sécurité).
permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # ════════════════════════════════════════════════════════════════════
  # JOB 1 — Lint + Tests + Couverture (sur Python 3.11 et 3.12)
  # ════════════════════════════════════════════════════════════════════
  lint-test:
    name: Lint & Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'   # cache intelligent des dépendances pip

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov pytest-asyncio httpx
          pip install -r requirements.txt

      - name: Lint (Ruff)
        run: ruff check .
        continue-on-error: true   # le style ne doit pas bloquer le pipeline

      - name: Tests unitaires + couverture
        run: python -m pytest tests/ --cov=ai_service --cov-report=xml --cov-report=term

      - name: Envoi de la couverture à Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ════════════════════════════════════════════════════════════════════
  # JOB 2 — Sécurité du code (outils 100% open-source, aucun compte requis)
  #   Bandit    : détecte les failles dans le code Python.
  #   pip-audit : détecte les vulnérabilités connues des dépendances.
  # ════════════════════════════════════════════════════════════════════
  security-code:
    name: Sécurité code (Bandit + pip-audit)
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Installation des outils de sécurité
        run: pip install bandit pip-audit

      - name: Bandit (analyse statique de sécurité)
        run: bandit -r ai_service -f txt -o bandit-report.txt || true

      - name: pip-audit (vulnérabilités des dépendances)
        run: pip-audit -r requirements.txt -f json -o pip-audit-report.json || true

      - name: Publication des rapports de sécurité
        uses: actions/upload-artifact@v4
        with:
          name: rapports-securite
          path: |
            bandit-report.txt
            pip-audit-report.json
          if-no-files-found: ignore

  # ════════════════════════════════════════════════════════════════════
  # JOB 3 — Build Docker + scan Trivy (vulnérabilités image + filesystem)
  # ════════════════════════════════════════════════════════════════════
  build-scan:
    name: Build image & scan Trivy
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - name: Construction de l'image Docker
        run: docker build -t ai-recruitment:${{ github.sha }} .

      - name: Trivy — scan du filesystem (dépendances, secrets, configs)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'   # tolérance : informe sans bloquer le pipeline

      - name: Trivy — scan de l'image construite
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'ai-recruitment:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ════════════════════════════════════════════════════════════════════
  # JOB 4 — Analyse qualité SonarCloud (gratuit pour les repos publics)
  #   Nécessite le secret SONAR_TOKEN (voir guide). Sans lui, le job
  #   n'échoue pas le pipeline grâce à continue-on-error.
  # ════════════════════════════════════════════════════════════════════
  sonarcloud:
    name: Analyse SonarCloud
    runs-on: ubuntu-latest
    needs: lint-test
    # Tourne sur push (vers main) ET sur pull request → permet l'analyse SonarCloud
    # d'une branche de travail via une PR (sans la merger), conforme au plan gratuit.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet pour une analyse fiable

      # On régénère la couverture pour la transmettre à Sonar.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Dépendances + couverture
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio httpx
          pip install -r requirements.txt
          python -m pytest tests/ --cov=ai_service --cov-report=xml || true

      - name: Scan SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ════════════════════════════════════════════════════════════════════
  # JOB 5 — Publication de l'image (uniquement sur main/master)
  #   Pousse vers GitHub Container Registry (ghcr.io), gratuit, via GITHUB_TOKEN.
  #   Pour publier sur Docker Hub à la place, voir le guide CI/CD.
  # ════════════════════════════════════════════════════════════════════
  publish:
    name: Publication GHCR
    runs-on: ubuntu-latest
    needs: [build-scan, security-code]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR exige un nom d'image en minuscules ; on convertit owner/repo.
      - name: Préparer le nom d'image (minuscules)
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build & push de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
